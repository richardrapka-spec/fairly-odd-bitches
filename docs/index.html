<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fairly Odd Bitches</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fairly Odd">
<meta name="theme-color" content="#1a1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="book" aria-label="Fairly Odd Bitches">
    <!-- the scene: one poster and four clips, stacked; only one is visible -->
    <img id="poster" class="layer" src="assets/cover.jpg" alt="">
    <video id="vFwd" class="layer clip" data-src="assets/full.mp4" playsinline muted preload="auto"></video>
    <video id="vRev" class="layer clip" data-src="assets/full-rev.mp4" playsinline muted preload="auto"></video>

    <!-- the words on the right-hand page, written in as the page settles -->
    <section id="page" class="page" hidden>
      <p class="folio"><span id="folio"></span></p>
      <h1 id="name"></h1>
      <p id="about" class="about"></p>
      <p id="note" class="note"></p>
      <button id="open" class="open" type="button"><span id="openLabel">Open the thread</span></button>
      <p class="hint" id="hint"></p>
    </section>

    <!-- the cover's one invitation -->
    <button id="lift" class="lift" type="button" aria-label="Open the book" disabled><span>the book is coming…</span></button>

    <!-- corners: back and forward, always there when the book is open -->
    <button id="back" class="corner back" type="button" aria-label="Previous page" hidden>‹</button>
    <button id="next" class="corner next" type="button" aria-label="Next page" hidden>›</button>
    <button id="edit" class="pen" type="button" aria-label="Edit this page" hidden>✎</button>
  </main>

  <!-- editing a page: her words, and the thread it opens -->
  <dialog id="editor">
    <form method="dialog" id="editForm">
      <h2>This page</h2>
      <label>Name <input id="fName" maxlength="24" autocomplete="off"></label>
      <label>For <input id="fAbout" maxlength="40" autocomplete="off" placeholder="baking, homeschool…"></label>
      <label>A line of yours <textarea id="fNote" rows="2" maxlength="160" placeholder="anything you want written here"></textarea></label>
      <label>The ChatGPT thread <input id="fLink" inputmode="url" autocomplete="off" placeholder="paste the conversation link"></label>
      <p class="how">Not the Share button: that makes a public read-only copy. The living thread's address only shows in a browser: open chatgpt.com in Safari, open the conversation, copy the address bar (it has /c/ in it), paste it here. Tapping this page then opens that thread in the ChatGPT app.</p>
      <div class="row"><button type="button" id="editCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
